<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Idle Clicker</title>
<meta name="description" content="A browser-based idle/incremental game.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>Idle Clicker</h1>
</header>
<main id="game">
  <div id="offline-summary" hidden>
    <span id="offline-summary-text"></span>
    <button type="button" id="dismiss-offline-summary">Dismiss</button>
  </div>
  <p id="gold-display">Gold: 0</p>
  <div id="click-button-wrap" class="click-wrap">
    <button id="click-button" type="button">Click</button>
  </div>
  <div id="generators"></div>
  <div id="prestige">
    <p id="prestige-shards"></p>
    <p id="prestige-payout"></p>
    <button type="button" id="prestige-button">Prestige</button>
  </div>
</main>
<script src="js/game-lib.js"></script>
<script src="js/game.js"></script>
</body>
</html>
